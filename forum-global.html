<!DOCTYPE html>
<html lang="en-US" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .pesan-baru { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        
        <!-- Header Navigation -->
        <div class="flex items-center justify-between mb-6">
            <button onclick="window.history.back()" class="text-gray-500 hover:text-blue-600 font-medium transition-colors">
                <span class="mr-1">←</span> <span id="txt-kembali">Back</span>
            </button>
            <div class="text-right">
                <div class="text-xs text-gray-500" id="txt-masuk-sebagai">Logged in as:</div>
                <div id="nama-pengguna" class="font-bold text-gray-800">Anonymous</div>
            </div>
        </div>

        <!-- Room Title -->
        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-gray-800 capitalize" id="judul-ruang">Loading...</h1>
            <p class="text-gray-500 text-sm" id="txt-subjudul">Currently in this discussion room.</p>
        </div>

        <!-- Post Box -->
        <div class="bg-white rounded-3xl shadow-md p-4 mb-8">
            <textarea id="input-post" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-4 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-gray-700" placeholder="Write your discussion or question here..."></textarea>
            <div class="flex justify-end mt-3">
                <button id="btn-post" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl transition-colors shadow-sm">
                    Post
                </button>
            </div>
        </div>

        <!-- Feed -->
        <div id="feed-postingan" class="space-y-6">
            <div class="text-center py-10 text-gray-400" id="txt-loading">Loading discussions...</div>
        </div>

    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
  apiKey: "AIzaSyDlaaNbqCYsNDZtawY9n42qYrQL3vtyiRw",
  authDomain: "forum-app-id.firebaseapp.com",
  projectId: "forum-app-id",
  storageBucket: "forum-app-id.firebasestorage.app",
  messagingSenderId: "1006757478713",
  appId: "1:1006757478713:web:c2b489ec6ff904ac4fa8e8"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const ruangSaatIni = urlParams.get('ruang') || 'general';

        const teks = {
            kembali: 'Back',
            masuk: 'Logged in as:',
            placeholder: 'Write your discussion or question here...',
            kirim: 'Post',
            loading: 'Loading discussions...',
            kosong: 'No discussions yet. Be the first to post!',
            mintaNama: 'What is your name? (This will be shown in the forum)'
        };

        document.getElementById('html-tag').lang = 'en-US';
        document.getElementById('judul-ruang').innerText = "# " + ruangSaatIni.replace(/-/g, ' ');

        let namaUser = localStorage.getItem('nama_forum') || null;
        if (namaUser) {
            document.getElementById('nama-pengguna').innerText = namaUser;
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) signInAnonymously(auth);
        });

        function formatWaktu(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate();
            return new Intl.DateTimeFormat('en-US', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
        }

        const btnPost = document.getElementById('btn-post');
        const inputPost = document.getElementById('input-post');

        btnPost.addEventListener('click', async () => {
            const isiPesan = inputPost.value.trim();
            if (!isiPesan) return;

            if (!namaUser) {
                const inputNama = prompt(teks.mintaNama);
                if (!inputNama || inputNama.trim() === "") return;
                namaUser = inputNama.trim();
                localStorage.setItem('nama_forum', namaUser);
                document.getElementById('nama-pengguna').innerText = namaUser;
            }

            btnPost.disabled = true;
            btnPost.innerText = "...";

            try {
                await addDoc(collection(db, "postingan"), {
                    ruang: ruangSaatIni,
                    penulis: namaUser,
                    teks: isiPesan,
                    waktu: serverTimestamp()
                });
                inputPost.value = '';
            } catch (error) {
                console.error("Error:", error);
                alert("Failed to post.");
            } finally {
                btnPost.disabled = false;
                btnPost.innerText = teks.kirim;
            }
        });

        const feedPostingan = document.getElementById('feed-postingan');
        const q = query(collection(db, "postingan"), where("ruang", "==", ruangSaatIni), orderBy("waktu", "desc"));
        
        onSnapshot(q, (snapshot) => {
            feedPostingan.innerHTML = '';
            
            if (snapshot.empty) {
                feedPostingan.innerHTML = `<div class="text-center py-10 text-gray-400">${teks.kosong}</div>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const htmlPost = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 pesan-baru">
                        <div class="flex justify-between items-center mb-2">
                            <div class="font-bold text-gray-800">${data.penulis}</div>
                            <div class="text-xs text-gray-400">${formatWaktu(data.waktu)}</div>
                        </div>
                        <p class="text-gray-700 whitespace-pre-wrap">${data.teks}</p>
                    </div>
                `;
                feedPostingan.insertAdjacentHTML('beforeend', htmlPost);
            });
        });
    </script>
</body>
</html>
